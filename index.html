<!doctype html>
<html lang="en">
<head>

<title>Broadside</title>
<style>

  .hudel { position:absolute; }

  .hpl, .hpv { position:absolute; top:0; line-height:19px; font-size:11.5px; font-weight:bold; letter-spacing:.14em; text-shadow:0 1px 2px #000, 0 0 3px #000; z-index:1; }

  .bossrow small { color:var(--parch2); font-size:12px; letter-spacing:.06em; }
  .xprail { left:12px; top:50%; transform:translateY(-50%); height:min(46vh, 380px); width:40px; display:flex; flex-direction:column; align-items:center; }

  .lvb small { font-size:8px; letter-spacing:.12em; color:var(--parch2); } .lvb b { font-size:17px; color:var(--gold); }
  .xpbar { position:relative; flex:1; width:14px; margin-top:-5px; border-radius:0 0 7px 7px; background:linear-gradient(90deg,#030a14,#0b1a2c); border:1px solid #000; box-shadow:0 0 0 2px #b98a3e99, inset 0 1px 3px #000c; overflow:hidden; }
  #xpFill { position:absolute; left:0; right:0; bottom:0; height:0; background:linear-gradient(0deg,#2f6fb0,#7fd0ff); transition:height .15s ease-out; }
  #xpTxt { position:absolute; left:50%; bottom:6px; transform:translateX(-50%) rotate(180deg); writing-mode:vertical-rl; font-size:10px; white-space:nowrap; }
  .tr { right:12px; top:12px; display:flex; gap:12px; align-items:center; padding:6px 12px; }
  .trv { display:flex; align-items:center; gap:4px; } .trv .ico { width:16px; height:16px; color:var(--gold); } .trv b { color:var(--gold); font-size:17px; }
  .bc { left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:5px; padding:7px 10px; }
  .ab { position:relative; width:44px; height:44px; border-radius:9px; background:radial-gradient(circle at 35% 30%, #35587f, #0f2037); border:1px solid #000;
    box-shadow:inset 0 0 0 2px #6b5a3a, 0 2px 4px #0008; overflow:hidden; text-align:center; }
  .ab .sw { position:absolute; inset:0; background:conic-gradient(#000000b8 var(--p,0%), transparent 0); }
  .ab .ag { position:absolute; left:0; right:0; top:11px; font-size:15px; font-weight:bold; color:var(--c); letter-spacing:.02em; }
  .ab .ak { position:absolute; left:2px; top:1px; font-size:11px; padding:0 4px; border-radius:4px; background:#000a; color:var(--parch); }
  .ab .al { position:absolute; right:3px; bottom:1px; font-size:9.5px; color:var(--parch2); }
  .ab .ac { position:absolute; left:0; right:0; top:14px; font-size:15px; font-weight:bold; color:#fff; text-shadow:0 1px 3px #000, 0 0 4px #000; }
  .ab .ak { font-size:9px; }
  .ab .ag .ico { width:22px; height:22px; filter:drop-shadow(0 1px 1px #000); }
  .ab.big { width:56px; height:56px; } .ab.big .ag { top:9px; } .ab.big .ag .ico { width:28px; height:28px; } .ab.big .ac { z-index:2; top:17px; font-size:18px; }
  .ab.sp { margin-right:6px; outline:2px solid var(--gold); outline-offset:1px; }
  .ab.fs .sw { z-index:1; } .ab.fs .ak { background:#f6d06a; color:#000; font-weight:bold; z-index:2; }
  .ab.fs .sn, .ab.sp .sn { position:absolute; left:0; right:0; bottom:0; z-index:2; font-size:8px; letter-spacing:-.03em; overflow:hidden; font-weight:bold; background:#000b; color:var(--c); white-space:nowrap; }
  .ab.fs.on { box-shadow:inset 0 0 0 2px #fff4c0, 0 0 14px #f6d06a, 0 2px 4px #0008; } .ab.fs.cd .ag { opacity:.35; }
  .ab.sp .port { position:absolute; inset:0; width:100%; height:100%; }
  .ab.sp .ak { background:var(--gold); color:#000; font-weight:bold; z-index:2; }
  .ab.sp .sw { z-index:1; }
  .ab.sp.cd .port { filter:saturate(.5) brightness(.8); }
  .ab.cd .ag { opacity:.3; }
  .ab.rdy { box-shadow:inset 0 0 0 2px var(--c), 0 0 10px var(--c), 0 2px 4px #0008; animation:rdy 1.6s ease-in-out infinite; }
  .ab.max { box-shadow:inset 0 0 0 2px var(--gold), 0 0 6px #e8b23a99, 0 2px 4px #0008; border-color:var(--gold); }
  .ab.max.rdy { box-shadow:inset 0 0 0 2px var(--gold), 0 0 12px var(--gold), 0 2px 4px #0008; }
  @keyframes rdy { 50% { filter:brightness(1.3); } }
  .card .plus { display:block; margin-top:8px; padding:4px 6px; border-radius:5px; color:#5a2d00; background:#e8b23a66; border:1px solid #b98a3e; }
  .card .slot { display:block; margin:6px 0; color:#1a3557; text-transform:uppercase; font-size:12px; letter-spacing:.08em; }
  .lbl { display:flex; justify-content:space-between; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--parch2); margin-top:4px; }
  .lbl b { color:var(--gold); font-size:13px; }
  .bar { position:relative; height:12px; background:linear-gradient(#030a14,#0b1a2c); border:1px solid #000; border-radius:6px; overflow:hidden; margin:3px 0 5px; box-shadow:inset 0 1px 3px #000c, 0 1px 0 #ffffff14; }
  .bar i { display:block; height:100%; width:0; transition:width .15s ease-out; border-radius:5px; }
  .bar i::after { content:''; position:absolute; left:0; right:0; top:0; height:45%; background:linear-gradient(#ffffff55,#ffffff00); border-radius:5px 5px 0 0; }
  .bar i { position:relative; }
  #hpFill { transition:width .1s ease-out; }
  #hpTrail { background:#f5e6c4; transition:width .5s ease-out .4s; }
  #vig { position:absolute; inset:0; opacity:0; background:radial-gradient(ellipse at center, #0000 45%, #d0201088 80%, #d02010dd 100%); }
  #nums { position:absolute; inset:0; overflow:hidden; }
  .dn { position:absolute; left:0; top:0; display:none; font-weight:bold; font-size:17px; color:#fff; letter-spacing:.02em;
    text-shadow:0 2px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000, 0 0 6px #000a; will-change:transform; }
  .dn.boss { color:#ffd84a; font-size:25px; } .dn.hurt { color:#ff5a45; font-size:23px; } .dn.lucky { color:#7dffb0; font-size:23px; }
  .dn.heal { color:#6dff8e; font-size:22px; } .dn.blast { color:#ff9a3a; font-size:30px; } .dn.gold { color:#ffd84a; font-size:28px; } .dn.grog { color:#8dffb0; font-size:28px; }
  @keyframes cardIn { from { opacity:0; transform:scale(.8) translateY(16px); } to { opacity:1; transform:none; } }
  .anim .card { animation:cardIn .35s cubic-bezier(.2,.9,.3,1.2) backwards; animation-delay:calc(var(--i, 0) * 90ms); }
  #hpFill { background:linear-gradient(#ec6a4a,#c2412d 55%,#7a1f12); } #bossFill { background:linear-gradient(90deg,#7b1f14,#e8553e); }
  #bossBarWrap { display:none; width:86%; } #bossBarWrap .bar { height:12px; margin:0; }
  #bossBarWrap.sub #bossFill { background:repeating-linear-gradient(-45deg,#2f5f86 0 6px,#4f8fb8 6px 12px); opacity:.75; }
  .bossrow small.bst { color:#9fd4ff; font-style:italic; }
  #windArrow { display:inline-block; font-size:20px; line-height:1; color:var(--parch); transition:transform .2s; text-shadow:0 0 6px #7fd0ff88, 0 1px 1px #000; }
  #cards { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-wrap:wrap; gap:20px; pointer-events:auto; flex-direction:row; padding:20px;
    background:radial-gradient(ellipse at center, #0a1a2ca8 0%, #050d18d8 75%); }
  #cards h2 { width:100%; text-align:center; margin:0; font-size:34px; color:var(--gold); letter-spacing:.04em; text-shadow:0 3px 0 #000, 0 0 18px #e8b23a55; }
  .card { width:224px; min-height:200px; color:var(--ink); border-radius:10px; padding:15px; cursor:pointer; transition:transform .12s, box-shadow .12s;
    background:radial-gradient(ellipse at 30% 20%, #fbf3dc 0%, #efe1bb 55%, #dcc791 100%);
    border:2px solid #5b3d17; box-shadow:inset 0 0 0 3px #f8eed4, inset 0 0 0 4px #b98a3e, inset 0 0 22px #a5803f55, 0 8px 20px #000b; text-shadow:none; }
  .card:hover { transform:translateY(-6px); box-shadow:inset 0 0 0 3px #f8eed4, inset 0 0 0 4px #b98a3e, inset 0 0 22px #a5803f55, 0 12px 26px #000c, 0 0 0 2px #e8b23a; }
  .card .k { float:right; background:linear-gradient(#1a3557,#0d1f35); color:var(--parch); border-radius:5px; padding:0 8px; font-weight:bold; box-shadow:0 1px 2px #0008; }
  .card h3 { margin:0 0 8px; font-size:19px; color:#3a2410; } .card p { margin:0; font-size:14px; line-height:1.38; }
  .card .ctype { margin:0 0 6px; font-size:12px; letter-spacing:.08em; color:#1a3557; } .card .ln { margin:3px 0; } .card .rar { margin-top:8px; font-size:13px; text-transform:uppercase; letter-spacing:.1em; }
  .card small { display:block; margin-top:8px; opacity:.7; }
  /* ---- level-up cards (v7): riveted metal frame by rarity (--m1 light, --m2 mid, --m3 dark), corner studs, ribbon banner,
     ringed medallion with a rendered 3D thumbnail (thumbs.ts), type badge on a metal plate, big stat lines, rarity plate ---- */
  #cards .crow { display:flex; gap:clamp(14px, 2.4vw, 30px); justify-content:center; align-items:stretch; width:100%; flex-wrap:wrap; }
  #cards .ucard { --m1:#f2dca0; --m2:#a8823e; --m3:#4a3412; --rim:var(--m2);
    --frame:linear-gradient(160deg, var(--m1), var(--m2) 36%, var(--m1) 58%, var(--m2) 78%, var(--m3));
    --plate:linear-gradient(var(--m1), var(--m2) 50%, var(--m3));
    position:relative; isolation:isolate; width:clamp(196px, 27vw, 246px); min-height:0; margin-top:26px; padding:28px 13px 12px; border-radius:24px 24px 14px 14px; border:9px solid transparent;
    display:flex; flex-direction:column; align-items:center; text-align:center; color:var(--ink);
    background:radial-gradient(ellipse at 50% 0%, #fbf3dc 0%, #efe1bb 52%, #d6bd86 100%) padding-box, var(--frame) border-box;
    box-shadow:inset 0 0 0 2px #0007, inset 0 0 0 3px #fff4, inset 0 0 26px #8a652a66, 0 0 0 1.5px #000c, 0 12px 26px #000c; }
  #cards .ucard::after { content:''; position:absolute; inset:-9px; border-radius:24px 24px 14px 14px; pointer-events:none; z-index:1;
    --rv:radial-gradient(circle, var(--m1) 0 1.2px, var(--m2) 1.9px, var(--m3) 3px, #0009 3.4px, transparent 3.8px);
    background:var(--rv) 0 34%, var(--rv) 0 58%, var(--rv) 0 82%, var(--rv) 100% 34%, var(--rv) 100% 58%, var(--rv) 100% 82%, var(--rv) 22% 100%, var(--rv) 50% 100%, var(--rv) 78% 100%;
    background-size:9px 9px; background-repeat:no-repeat; }
  #cards .ucard:hover { transform:translateY(-8px); box-shadow:inset 0 0 0 2px #0007, inset 0 0 0 3px #fff4, inset 0 0 26px #8a652a66, 0 0 0 1.5px #000c, 0 18px 32px #000d, 0 0 0 4px var(--gold); }
  #cards .r-common { --m1:#f6c29a; --m2:#b4683a; --m3:#5a2810; }
  #cards .r-uncommon { --m1:#f6f9fc; --m2:#9aa6b2; --m3:#3c4650; }
  #cards .r-rare { --m1:#fff2a6; --m2:#d9a21c; --m3:#6a4604; }
  #cards .r-epic { --m1:#b8fff2; --m2:#27b0a0; --m3:#4b2a96; --frame:linear-gradient(160deg, #b8fff2, #27b0a0 34%, #b8fff2 52%, #8a5ad8 74%, #3a1a6a); }
  #cards .r-epic::before { content:''; position:absolute; inset:-9px; border-radius:24px 24px 14px 14px; pointer-events:none; z-index:-1; animation:epic 1.8s ease-in-out infinite;
    box-shadow:0 0 16px 4px #3fd8c8aa, 0 0 34px 10px #8a5ad870; }
  @keyframes epic { 50% { box-shadow:0 0 24px 8px #3fd8c8cc, 0 0 44px 16px #8a5ad899; } }
  #cards .r-epic .medal { box-shadow:0 0 0 2px #000b, 0 4px 8px #0009, 0 0 14px 2px #3fd8c8aa; }
  #cards .ucard .stud { position:absolute; z-index:2; width:15px; height:15px; transform:rotate(45deg); background:linear-gradient(135deg, var(--m1), var(--m2) 50%, var(--m3));
    box-shadow:inset 0 0 0 1px #fff6, 0 0 0 1.5px #000c, 0 2px 3px #000a; }

  #cards .ucard .stud.bl { bottom:-17px; left:-17px; } #cards .ucard .stud.br { bottom:-17px; right:-17px; }
  #cards .ucard .ribbon { position:absolute; z-index:3; top:-31px; left:6px; right:6px; filter:drop-shadow(0 3px 2px #0009); }
  #cards .ucard .ribbon::before, #cards .ucard .ribbon::after { content:''; position:absolute; z-index:-1; top:11px; width:36px; height:27px; background:linear-gradient(#cdb47a, #8f7038); box-shadow:inset 0 0 0 1.5px #5b3d17; }

  #cards .ucard .ribbon span { display:block; padding:7px 6px; border-radius:2px; background:linear-gradient(#fffaea, #ecdcae 60%, #d9c48e); color:#2a1a08;

    background-size:10px 10px; background-repeat:no-repeat; }

  #cards .ucard.k-newmod .tbadge { color:#8fe0a0; } #cards .ucard.k-ship .tbadge { color:#9fd0ff; }

    color:var(--gold); font-size:11.5px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; box-shadow:0 0 0 1px #000c, 0 2px 3px #0008; }
  #cards .ucard.k-ability .tlabel { color:#ff9a5a; } #cards .ucard.k-newmod .tlabel { color:#8fe0a0; } #cards .ucard.k-ship .tlabel { color:#9fd0ff; }
  #cards .ucard .cbody { flex:1; width:100%; margin-top:8px; display:flex; flex-direction:column; justify-content:center; min-height:96px; }
